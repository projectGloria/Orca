name: Signed release
on:
  push:
    branches: [main, master]
    paths: [version.properties]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signed-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Install SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Validate release version
        id: version
        run: python3 scripts/release.py version
      - name: Restore signing key
        env:
          ORCA_KEYSTORE_BASE64: ${{ secrets.ORCA_KEYSTORE_BASE64 }}
          ORCA_STORE_PASSWORD: ${{ secrets.ORCA_STORE_PASSWORD }}
          ORCA_KEY_ALIAS: ${{ secrets.ORCA_KEY_ALIAS }}
          ORCA_KEY_PASSWORD: ${{ secrets.ORCA_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          names = ['ORCA_KEYSTORE_BASE64', 'ORCA_STORE_PASSWORD', 'ORCA_KEY_ALIAS', 'ORCA_KEY_PASSWORD']
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('Configure all four ORCA signing secrets before releasing. Never substitute a debug key.')
          key = Path(os.environ['RUNNER_TEMP']) / 'orca-personal.jks'
          key.write_bytes(base64.b64decode(os.environ['ORCA_KEYSTORE_BASE64'], validate=True))
          key.chmod(0o600)
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r')
          fields = {'storeFile': str(key), 'storePassword': os.environ['ORCA_STORE_PASSWORD'],
                    'keyAlias': os.environ['ORCA_KEY_ALIAS'], 'keyPassword': os.environ['ORCA_KEY_PASSWORD']}
          Path('signing.properties').write_text(''.join(f'{k}={escape(v)}\n' for k, v in fields.items()))
          Path('signing.properties').chmod(0o600)
          PY
      - name: Test and build signed APKs
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          bash gradlew testDebugUnitTest lintDebug assembleRelease
      - name: Verify and package
        run: |
          for apk in app/build/outputs/apk/release/*-release.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
            python3 scripts/check_native_alignment.py "$apk"
          done
          python3 scripts/release.py package
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish --repository "$GITHUB_REPOSITORY"
      - name: Remove signing files
        if: always()
        run: rm -f signing.properties "$RUNNER_TEMP/orca-personal.jks"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Orca-${{ steps.version.outputs.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
